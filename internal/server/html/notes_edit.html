{{define "notes_edit.html"}}
<!DOCTYPE html>
<html lang="en" class="page-notes-edit">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Note - Aslam</title>
    {{template "style"}}
</head>
<body>
    <div class="app">
        {{template "header" .}}
        <main class="app-content">
            <h2>Edit: {{.Item.Title}}</h2>
            {{if .IsOwner}}
            <div class="editor-help">
                <button onclick="toggleNotePublic()" id="public-toggle" class="compact-visibility {{if .Item.Public}}is-public{{end}}">
                    {{if .Item.Public}}Public{{else}}Private{{end}}
                </button>
            </div>
            <script>
            async function toggleNotePublic() {
                const btn = document.getElementById('public-toggle');
                const isPublic = btn.textContent.trim() === 'Public';
                await fetch('/api/notes/toggle-public', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id: {{.Item.ID}}, public: !isPublic})
                });
                location.reload();
            }
            </script>
            {{end}}
            <p class="muted mb-20"><a href="/notes">&larr; back to notes</a></p>

            <form action="/notes/edit/{{.Item.ID}}" method="POST" class="edit-form">
                <label>Title
                    <input type="text" name="title" value="{{.Item.Title}}" required class="form-control">
                </label>
                <label>Content
                    <textarea name="content" class="form-control">{{.Item.Content}}</textarea>
                </label>
                <div class="buttons">
                    <button type="submit" class="form-submit">Save Changes</button>
                    <a href="/notes" class="form-submit form-secondary">Cancel</a>
                </div>
            </form>

            <form action="/notes/delete/{{.Item.ID}}" method="POST" class="editor-danger-zone">
                <button type="submit" onclick="return confirm('Delete this note permanently?')" class="button compact-delete">Delete</button>
            </form>
        </main>
    </div>
</body>
</html>
{{end}}
