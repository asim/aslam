{{define "notes_view.html"}}
<!DOCTYPE html>
<html lang="en" class="page-notes-view">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Item.Title}} - Aslam</title>
    {{template "style"}}
</head>
<body>
    <div class="app">
        {{template "header" .}}
        <main class="app-content">
            <div class="content-heading">
                <h2 class="mb-0">{{.Item.Title}}</h2>
                {{if .IsOwner}}
                <a href="/notes/edit/{{.Item.ID}}" class="compact-edit">Edit</a>
                {{end}}
            </div>

            <div class="note-content" id="note-content">{{.Item.Content}}</div>

            <div class="note-meta">
                <span data-time="{{.Item.UpdatedAt.Unix}}"></span>
                {{if .Item.Public}}<span class="public-badge">public</span>{{end}}
            </div>
        </main>
    </div>
    <script>
    function timeAgo(timestamp) {
        const seconds = Math.floor((Date.now() / 1000) - timestamp);
        if (seconds < 60) return 'just now';
        if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
        if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
        if (seconds < 604800) return Math.floor(seconds / 86400) + 'd ago';
        return Math.floor(seconds / 604800) + 'w ago';
    }
    document.querySelectorAll('[data-time]').forEach(el => {
        el.textContent = timeAgo(parseInt(el.dataset.time));
    });
    // Linkify internal paths
    const el = document.getElementById('note-content');
    if (el) {
        const text = el.textContent;
        const match = text.match(/(\/(?:islamqa|ghazali|quran|hadith|names|notes|chat|salihin|adhkar|arabic)\/[\w\/\-]+)/);
        if (match) {
            const path = match[1];
            const label = path.slice(1);
            const rest = text.replace(match[0], '').trim();
            const link = document.createElement("a");
            link.className = "source-link"; link.href = path; link.textContent = label;
            el.replaceChildren(link);
            if (rest) { el.append(document.createElement("br"), document.createTextNode(rest)); }
        }
    }
    </script>
</body>
</html>
{{end}}
