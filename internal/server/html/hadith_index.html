{{define "hadith_index.html"}}
<!DOCTYPE html>
<html lang="en" class="page-hadith-index">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahih al-Bukhari - Aslam</title>
    {{template "style"}}
</head>
<body>
    <div class="app">
        {{template "header" .}}
        <main class="app-content">
            <h2>Sahih al-Bukhari</h2>
            <p class="muted mb-20">{{len .Books}} books &middot; 7,265 hadiths</p>
            <div class="book-grid">
                {{range .Books}}
                <a href="/hadith/book/{{index . "BookNumber"}}">
                    <span class="book-num">{{index . "BookNumber"}}.</span>
                    <span class="book-name">{{index . "Book"}}</span>
                    <span class="book-count">{{index . "Count"}}</span>
                </a>
                {{end}}
            </div>
        </main>
    </div>
</body>
</html>
{{end}}
